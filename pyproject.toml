[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hippocamp"
version = "0.11.0"
description = "Local-first portable memory for AI agents — tiered storage, observable recall, first-class forgetting, cross-machine sync."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Leosoft" }]
keywords = ["llm", "agent", "memory", "mcp", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pydantic>=2.0",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
embeddings-lite = ["fastembed>=0.3"]
embeddings = ["sentence-transformers>=2.2"]
mcp = ["mcp>=1.0"]
llm = ["anthropic>=0.40"]
# Bundled SQLite with extension-loading support. Required when running
# on a Python whose stdlib sqlite3 was built without
# enable_load_extension (notably the python.org macOS installer). Only
# Linux wheels are published on PyPI today; on macOS you need a Python
# that ships sqlite3 with extensions (Homebrew, uv-managed, etc).
bundled-sqlite = ["pysqlite3-binary>=0.5; sys_platform == 'linux'"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "sentence-transformers>=2.2",
    "fastembed>=0.3",
]

[project.scripts]
hippocamp = "hippocamp.cli:main"
hippocamp-mcp = "hippocamp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hippocamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
