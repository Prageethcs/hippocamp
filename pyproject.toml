[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hippocamp"
version = "0.0.1"
description = "Local-first agent memory with tiered storage, observable retrieval, and first-class forgetting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Leosoft" }]
keywords = ["llm", "agent", "memory", "mcp", "local-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
hippocamp-mcp = "hippocamp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hippocamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
