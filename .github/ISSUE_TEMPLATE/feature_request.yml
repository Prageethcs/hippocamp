name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Hippocamp aims to stay small and focused, so the bar for new features is "does this make memory more *portable*, more *structured*, or more *observable*?" Anything else is a harder sell — but please open the issue anyway so we can discuss.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case. What are you trying to do, and why is it hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the API / CLI / behaviour look like? Concrete sketches > abstract descriptions.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this, and why you ruled them out.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — links, prior art, related issues.
